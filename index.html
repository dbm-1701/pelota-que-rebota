<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pelotita loca</title>
    <link rel="icon" href="data:,">
    <style>
        /* Reset: sin margenes ni scroll, el canvas ocupa toda la pantalla */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        canvas {
            display: block;
        }

        /* Titulo centrado encima del canvas */
        #titulo {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            padding-top: 16px;
            text-align: center;
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
            color: #fff;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.6);
            user-select: none;
            pointer-events: none; /* deja pasar el cursor a la pelota */
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/p5@2.3.4/lib/p5.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/p5.sound@0.4.1/dist/p5.sound.min.js"></script>
    <script src="sketch.js"></script>
</head>
<body>
    <h1 id="titulo">Pelotita loca</h1>
</body>
</html>
